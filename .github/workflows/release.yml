name: Release

# Тег из четырёх чисел (1.0.0.0) -> общие проверки -> релиз в форматах .zip, .skill, .prompt.md.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    uses: Dezodemius/agent-skills/.github/workflows/skill-release.yml@main
    with:
      extra-check: python -X utf8 tools/check.py
      os: '["ubuntu-latest", "windows-latest"]'
