name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate four-component tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, re; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]), "Tag must have four numeric components"'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package verified skill
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package.py --version "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Лист персонажа ПЧК $RELEASE_TAG" --generate-notes --notes-file .github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/pchk-character.zip dist/pchk-character.skill dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
